<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 감성 음악 추천 | Music Match</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 20%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        header p {
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 12px;
            color: #e2e8f0;
        }

        .chip-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 10px 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 0.95rem;
            user-select: none;
        }

        .chip:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            transform: translateY(-2px);
        }

        .chip.active {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
        }

        select, input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        select option {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.3);
            margin-top: 10px;
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        #results-section {
            display: none;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .song-list {
            display: grid;
            gap: 16px;
        }

        .song-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .song-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .song-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(236, 72, 153, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .song-details h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .song-details p {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .tag-reason {
            display: inline-block;
            margin-top: 6px;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(139, 92, 246, 0.2);
            color: #c084fc;
        }

        .btn-listen {
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }

        .btn-listen:hover {
            background: var(--text-main);
            color: var(--bg-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🎵 Music Match</h1>
            <p>당신의 오늘 기분과 취향에 딱 맞는 맞춤형 곡을 찾아드립니다.</p>
        </header>

        <div class="card">
            <form id="recommendation-form">
                <div class="form-group">
                    <label>1. 지금 어떤 기분(분위기)이신가요?</label>
                    <div class="chip-group" id="mood-chips">
                        <div class="chip active" data-value="신나는">🎉 신나는</div>
                        <div class="chip" data-value="차분한">☕ 차분한</div>
                        <div class="chip" data-value="감성적인">🌙 감성적인</div>
                        <div class="chip" data-value="몽환적인">✨ 몽환적인</div>
                        <div class="chip" data-value="집중되는">💻 집중/공부</div>
                        <div class="chip" data-value="드라이브">🚗 드라이브</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="genre">2. 좋아하는 장르를 선택해주세요</label>
                    <select id="genre">
                        <option value="kpop">K-POP / 아이돌</option>
                        <option value="pop">해외 POP</option>
                        <option value="indie">인디 / 어쿠스틱</option>
                        <option value="hiphop">힙합 / 알앤비 (R&B)</option>
                        <option value="ballad">발라드</option>
                        <option value="rock">록 / 밴드 뮤직</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="favorite">3. 평소 좋아하는 아티스트나 스타일이 있다면 입력해주세요 (선택)</label>
                    <input type="text" id="favorite" placeholder="예: 아이유, NewJeans, 2000년대 감성 등">
                </div>

                <button type="submit" class="btn-submit">맞춤 노래 추천받기 ✨</button>
            </form>
        </div>

        <div id="results-section">
            <h2 class="section-title">🎧 당신만을 위한 추천 트랙</h2>
            <div class="song-list" id="song-list"></div>
        </div>
    </div>

    <script>
        const chips = document.querySelectorAll('#mood-chips .chip');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
            });
        });

        const musicDatabase = [
            { title: "Hype Boy", artist: "NewJeans", genre: "kpop", mood: "신나는", reason: "청량하고 경쾌한 비트로 기분 전환에 최고" },
            { title: "Ditto", artist: "NewJeans", genre: "kpop", mood: "감성적인", reason: "아련하고 포근한 아날로그 감성" },
            { title: "Supernova", artist: "aespa", genre: "kpop", mood: "신나는", reason: "중독성 강한 힙한 댄스 비트" },
            { title: "밤편지", artist: "아이유", genre: "indie", mood: "차분한", reason: "조용히 귓가에 맴도는 서정적인 어쿠스틱" },
            { title: "사건의 지평선", artist: "윤하", genre: "rock", mood: "감성적인", reason: "벅차오르는 밴드 사운드와 호소력 짙은 보컬" },
            { title: "Off My Face", artist: "Justin Bieber", genre: "pop", mood: "차분한", reason: "감미로운 기타 리프와 달콤한 음색" },
            { title: "Cruel Summer", artist: "Taylor Swift", genre: "pop", mood: "드라이브", reason: "탁 트인 도로를 달리며 듣기 좋은 팝" },
            { title: "As It Was", artist: "Harry Styles", genre: "pop", mood: "신나는", reason: "레트로하면서도 경쾌한 신스팝 사운드" },
            { title: "자장가", artist: "검정치마", genre: "indie", mood: "몽환적인", reason: "몽환적이면서도 아늑한 밤의 분위기" },
            { title: "Square (2017)", artist: "백예린", genre: "indie", mood: "드라이브", reason: "바람을 맞으며 들으면 완벽한 세련된 음색" },
            { title: "Attention", artist: "Charlie Puth", genre: "pop", mood: "집중되는", reason: "세련된 베이스 라인이 몰입감을 더함" },
            { title: "주저하는 연인들을 위해", artist: "잔나비", genre: "indie", mood: "감성적인", reason: "빈티지한 울림과 낭만적인 가사" }
        ];

        document.getElementById('recommendation-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const selectedMood = document.querySelector('#mood-chips .chip.active').getAttribute('data-value');
            const selectedGenre = document.getElementById('genre').value;

            let filtered = musicDatabase.filter(song => {
                return song.mood === selectedMood || song.genre === selectedGenre;
            });

            if (filtered.length === 0) filtered = [...musicDatabase];

            const shuffled = filtered.sort(() => 0.5 - Math.random());
            const recommendations = shuffled.slice(0, 4);

            const resultsSection = document.getElementById('results-section');
            const songListContainer = document.getElementById('song-list');
            
            songListContainer.innerHTML = '';

            recommendations.forEach(song => {
                const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(song.artist + ' ' + song.title)}`;
                
                const card = document.createElement('div');
                card.className = 'song-card';
                card.innerHTML = `
                    <div class="song-info">
                        <div class="song-icon">🎵</div>
                        <div class="song-details">
                            <h3>${song.title}</h3>
                            <p>${song.artist}</p>
                            <span class="tag-reason"># ${song.reason}</span>
                        </div>
                    </div>
                    <a href="${searchUrl}" target="_blank" class="btn-listen">듣기 ↗</a>
                `;
                songListContainer.appendChild(card);
            });

            resultsSection.style.display = 'block';
            resultsSection.scrollIntoView({ behavior: 'smooth' });
        });
    </script>
</body>
</html>
